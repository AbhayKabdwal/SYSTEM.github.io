<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SYSTEM">
<meta name="theme-color" content="#040a14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<title>◆ SYSTEM</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#040a14;--bg2:#071020;--card:rgba(255,255,255,0.03);
  --border:rgba(0,200,255,0.15);--glow:#00c8ff;
  --text:#9ab8d0;--dim:#3a5870;--bright:#dceeff;
  --gold:#ffd700;--grn:#3dffa0;--red:#ff4060;
  --hd:'Orbitron',monospace;--bd:'Rajdhani',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg);color:var(--text);font-family:var(--bd);height:100%;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;position:relative;overflow:hidden}
.grid-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(0,200,255,0.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,200,255,0.025) 1px,transparent 1px);
  background-size:40px 40px;
}
.glow-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 120% 40% at 50% 0%,rgba(0,60,160,0.12) 0%,transparent 70%);
}
/* HEADER */
.hdr{
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  border-bottom:1px solid var(--border);
  background:rgba(4,10,20,0.95);
  backdrop-filter:blur(20px);
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.logo{font-family:var(--hd);font-size:14px;letter-spacing:5px;color:var(--glow)}
.player-badge{display:flex;align-items:center;gap:8px}
.rank-icon{
  width:36px;height:36px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--hd);font-size:16px;font-weight:900;
  border:1.5px solid currentColor;
}
.player-info{text-align:right}
.player-name{font-family:var(--hd);font-size:10px;letter-spacing:1px;color:var(--bright)}
.player-title{font-family:var(--hd);font-size:7px;letter-spacing:1.5px;margin-top:2px}
/* SCROLL AREA */
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;-webkit-overflow-scrolling:touch}
.scroll-area::-webkit-scrollbar{display:none}
.tab-content{padding:14px 14px calc(var(--safe-bot) + 80px)}
/* NAV */
.nav{
  position:relative;z-index:10;
  background:rgba(4,10,20,0.96);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom:var(--safe-bot);
  flex-shrink:0;
}
.nav-btn{
  flex:1;padding:10px 4px 8px;
  background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--hd);font-size:6.5px;letter-spacing:1px;
  color:var(--dim);border-top:2px solid transparent;
  transition:color .15s;
}
.nav-btn .ni{font-size:18px;line-height:1}
.nav-btn.active{color:var(--glow);border-top-color:var(--glow)}
/* CARDS */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:10px;
  position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,255,0.25),transparent)}
.card-body{padding:14px}
/* SECTION TITLE */
.sec{
  font-family:var(--hd);font-size:7.5px;letter-spacing:3px;
  color:var(--glow);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,200,255,0.2),transparent)}
/* RANK CARD */
.rank-card{display:flex;align-items:center;gap:14px}
.rank-big{
  width:60px;height:60px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--hd);font-size:26px;font-weight:900;
  border:2px solid currentColor;
}
.rank-detail{flex:1;min-width:0}
.rank-name{font-family:var(--hd);font-size:15px;font-weight:700;color:var(--bright);letter-spacing:2px}
.rank-sub{font-family:var(--hd);font-size:7.5px;letter-spacing:1.5px;margin-top:3px}
.xp-bar{margin-top:10px}
.xp-labels{display:flex;justify-content:space-between;font-family:var(--hd);font-size:6.5px;color:var(--dim);margin-bottom:5px}
.bar-track{height:3px;background:rgba(0,200,255,0.08);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width 1s ease}
/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat-card{background:rgba(0,200,255,0.03);border:1px solid rgba(0,200,255,0.1);border-radius:6px;padding:12px 6px;text-align:center}
.stat-val{font-family:var(--hd);font-size:22px;font-weight:700;color:var(--bright);line-height:1}
.stat-lbl{font-family:var(--hd);font-size:6px;letter-spacing:1px;color:var(--dim);margin-top:4px}
/* QUEST */
.quest-row{
  display:flex;align-items:center;gap:10px;
  padding:10px;border:1px solid rgba(0,200,255,0.1);
  border-radius:6px;background:rgba(0,200,255,0.02);
  margin-bottom:7px;
}
.quest-row.done{border-color:rgba(61,255,160,0.2);background:rgba(61,255,160,0.03)}
.quest-info{flex:1;min-width:0}
.quest-label{font-family:var(--hd);font-size:9px;letter-spacing:1px;color:var(--bright)}
.quest-prog{height:2px;background:rgba(0,200,255,0.08);border-radius:1px;margin-top:5px;overflow:hidden}
.quest-fill{height:100%;background:var(--grn);border-radius:1px}
.quest-inp{
  width:72px;
  background:rgba(0,200,255,0.06);
  border:1px solid rgba(0,200,255,0.15);
  color:var(--bright);padding:5px 8px;
  font-family:var(--bd);font-size:15px;font-weight:600;
  text-align:center;border-radius:4px;outline:none;
}
.quest-inp:focus{border-color:var(--glow)}
.quest-target{font-family:var(--hd);font-size:7px;color:var(--dim);white-space:nowrap;letter-spacing:.5px}
/* PENALTY */
.penalty-card{border-color:rgba(255,64,96,0.35)!important;background:rgba(255,64,96,0.04)!important}
.penalty-title{font-family:var(--hd);font-size:13px;letter-spacing:3px;color:var(--red)}
/* BTN */
.btn{
  background:none;border:1px solid var(--glow);color:var(--glow);
  padding:10px 18px;font-family:var(--hd);font-size:8px;letter-spacing:2px;
  cursor:pointer;border-radius:4px;transition:all .15s;width:100%;
  active:transform:scale(0.98);
}
.btn:active{background:rgba(0,200,255,0.12)}
.btn-grn{border-color:var(--grn);color:var(--grn)}
.btn-grn:active{background:rgba(61,255,160,0.1)}
.btn-red{border-color:var(--red);color:var(--red)}
.btn-sm{padding:5px 12px;font-size:7px}
/* RECOVERY */
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec-card{background:rgba(0,200,255,0.02);border:1px solid rgba(0,200,255,0.1);border-radius:6px;padding:12px}
.water-ctl{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px}
.water-btn{background:none;border:1px solid var(--border);color:var(--glow);width:30px;height:30px;border-radius:4px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.water-btn:active{background:rgba(0,200,255,0.1)}
.water-val{font-family:var(--hd);font-size:22px;color:var(--bright);min-width:32px;text-align:center}
.pill-check{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.pill-check input[type=checkbox]{width:20px;height:20px;accent-color:var(--grn);cursor:pointer}
/* PHOTO */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-slot{
  aspect-ratio:3/4;border:1px dashed rgba(0,200,255,0.2);
  border-radius:6px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  cursor:pointer;position:relative;overflow:hidden;background:rgba(0,200,255,0.02);
}
.photo-slot:active{opacity:.8}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-lbl{font-family:var(--hd);font-size:7px;letter-spacing:1.5px;color:var(--dim);text-align:center;margin-top:4px}
/* EXERCISE */
.ex-card{background:rgba(0,200,255,0.015);border:1px solid rgba(0,200,255,0.1);border-radius:6px;margin-bottom:8px;overflow:hidden}
.ex-hdr{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.ex-name{font-family:var(--hd);font-size:9.5px;letter-spacing:1px;color:var(--bright)}
.ex-unit{font-family:var(--hd);font-size:7px;letter-spacing:1px;color:var(--dim);margin-top:2px}
.set-row{
  display:grid;gap:6px;align-items:center;
  padding:6px 12px;border-top:1px solid rgba(0,200,255,0.07);
}
.set-inp{
  background:rgba(0,200,255,0.05);border:1px solid rgba(0,200,255,0.12);
  color:var(--bright);padding:5px 6px;font-family:var(--bd);font-size:14px;
  font-weight:600;text-align:center;border-radius:4px;outline:none;width:100%;
}
.set-inp:focus{border-color:var(--glow)}
.set-num{font-family:var(--hd);font-size:8px;color:var(--dim);text-align:center}
.remove-btn{background:none;border:none;color:rgba(255,64,96,0.4);font-size:18px;cursor:pointer;padding:0;line-height:1}
/* SELECT */
.sel{
  background:rgba(0,200,255,0.04);border:1px solid rgba(0,200,255,0.15);
  color:var(--bright);padding:8px 12px;font-family:var(--bd);font-size:14px;
  border-radius:4px;outline:none;width:100%;-webkit-appearance:none;
}
.sel option{background:#071020;color:var(--bright)}
/* DATE */
.date-inp{
  background:rgba(0,200,255,0.04);border:1px solid rgba(0,200,255,0.15);
  color:var(--bright);padding:10px 12px;font-family:var(--hd);font-size:12px;
  letter-spacing:1px;border-radius:4px;outline:none;width:100%;
}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.6) sepia(1) hue-rotate(180deg)}
/* SKILL TREE */
.skill-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.skill-tabs::-webkit-scrollbar{display:none}
.skill-tab{
  flex:0 0 auto;padding:4px 10px;border-radius:3px;
  font-family:var(--hd);font-size:7px;letter-spacing:1px;
  border:1px solid var(--border);color:var(--dim);cursor:pointer;
  background:none;white-space:nowrap;
}
.skill-tab.active{border-color:var(--glow);color:var(--glow);background:rgba(0,200,255,0.06)}
.skill-nodes{display:grid;gap:6px}
.skill-node{
  display:flex;align-items:center;gap:10px;
  padding:10px;border:1px solid rgba(0,200,255,0.1);
  border-radius:6px;background:rgba(0,200,255,0.02);
}
.skill-node.done{border-color:rgba(61,255,160,0.25);background:rgba(61,255,160,0.04)}
.skill-node.ready{border-color:rgba(255,215,0,0.2);background:rgba(255,215,0,0.03)}
.skill-node.locked{opacity:.4}
.skill-node-info{flex:1}
.skill-tier{font-family:var(--hd);font-size:6.5px;letter-spacing:1px;color:var(--dim)}
.skill-name{font-family:var(--hd);font-size:9px;letter-spacing:1px;margin-top:2px}
.skill-prog{font-family:var(--bd);font-size:12px;color:var(--dim);margin-top:2px}
.skill-status{font-size:16px}
/* CHALLENGE DOTS */
.challenge-dots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
.ch-dot{aspect-ratio:1;border-radius:2px;background:rgba(0,200,255,0.06);border:1px solid rgba(0,200,255,0.1)}
.ch-dot.done{background:rgba(61,255,160,0.25);border-color:rgba(61,255,160,0.4)}
/* RANK LADDER */
.rank-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px solid rgba(0,200,255,0.05);
}
.rank-badge-sm{
  width:28px;height:28px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--hd);font-size:11px;font-weight:700;
  border:1px solid currentColor;flex-shrink:0;
}
/* ARCHIVE */
.log-entry{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border:1px solid rgba(0,200,255,0.1);
  border-radius:6px;background:rgba(0,200,255,0.02);
  margin-bottom:6px;cursor:pointer;
}
.log-entry:active{background:rgba(0,200,255,0.06)}
/* TEMPLATE CARD */
.tpl-card{
  border:1px solid rgba(0,200,255,0.12);
  border-radius:6px;margin-bottom:8px;overflow:hidden;
}
.tpl-hdr{
  padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;
}
.tpl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tpl-body{border-top:1px solid rgba(0,200,255,0.08);padding:12px 14px}
/* WEEK PLAN */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week-cell{
  border:1px solid rgba(0,200,255,0.1);border-radius:5px;
  padding:7px 5px;text-align:center;
}
.week-cell.done{border-color:rgba(61,255,160,0.25);background:rgba(61,255,160,0.03)}
.week-cell.miss{border-color:rgba(255,64,96,0.22);background:rgba(255,64,96,0.03)}
.week-day{font-family:var(--hd);font-size:7px;color:var(--dim)}
.week-date{font-family:var(--hd);font-size:10px;color:var(--bright);margin-top:2px}
.week-status{font-size:12px;margin-top:4px}
/* ARCH DETAIL */
.arch-detail{padding:14px}
.set-chip{
  display:inline-block;background:rgba(0,200,255,0.06);
  border:1px solid rgba(0,200,255,0.12);border-radius:4px;
  padding:4px 10px;font-family:var(--hd);font-size:8.5px;
  color:var(--text);margin:3px 3px 3px 0;
}
/* FATIGUE */
.fatigue-bar{height:4px;background:rgba(0,200,255,0.06);border-radius:2px;overflow:hidden;margin-top:6px}
.fatigue-fill{height:100%;border-radius:2px;transition:width .8s ease}
/* SYSTEM ALERT */
.sys-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,0.88);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.sys-box{
  background:#040a14;border:1px solid rgba(0,200,255,0.35);
  border-radius:8px;padding:36px 28px;text-align:center;
  max-width:320px;width:100%;
  box-shadow:0 0 60px rgba(0,200,255,0.08);
  animation:slu .3s ease;
}
@keyframes slu{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.sys-title{font-family:var(--hd);font-size:8px;letter-spacing:4px;color:var(--glow);margin-bottom:16px}
.sys-msg{font-family:var(--hd);font-size:16px;font-weight:700;color:var(--gold);line-height:1.6;white-space:pre-line}
.sys-sub{font-family:var(--hd);font-size:6.5px;color:var(--dim);margin-top:18px;letter-spacing:2px}
/* TOAST */
.toast{
  position:fixed;bottom:calc(var(--safe-bot) + 76px);left:50%;
  transform:translateX(-50%);
  background:rgba(4,10,20,0.97);border:1px solid rgba(0,200,255,0.25);
  border-radius:4px;padding:8px 18px;
  font-family:var(--hd);font-size:8px;letter-spacing:2px;
  color:var(--text);z-index:99;white-space:nowrap;
  animation:fdi .2s ease;
}
@keyframes fdi{from{opacity:0}to{opacity:1}}
/* LOADING */
.loading{
  position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:2000;
}
.loading-title{font-family:var(--hd);font-size:24px;letter-spacing:8px;color:var(--glow);animation:lp 2s ease-in-out infinite}
@keyframes lp{0%,100%{opacity:.6}50%{opacity:1}}
.loading-bar{width:160px;height:2px;background:rgba(0,200,255,0.08);margin-top:20px;overflow:hidden;border-radius:1px}
.loading-fill{height:100%;background:var(--glow);animation:lf 1.8s ease-in-out infinite}
@keyframes lf{0%{width:0%;margin-left:0%}50%{width:50%;margin-left:25%}100%{width:0%;margin-left:100%}}
/* SETUP */
.setup{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:1500;padding:24px;
}
.setup-box{
  background:rgba(4,10,20,0.98);border:1px solid rgba(0,200,255,0.25);
  border-radius:10px;padding:36px 24px;max-width:340px;width:100%;
}
.text-inp{
  background:rgba(0,200,255,0.04);border:1px solid rgba(0,200,255,0.15);
  color:var(--bright);padding:12px 14px;
  font-family:var(--hd);font-size:13px;letter-spacing:2px;
  border-radius:4px;outline:none;width:100%;text-transform:uppercase;
}
.text-inp:focus{border-color:var(--glow)}
.penalty-mode{--border:rgba(255,64,96,0.2);--card:rgba(255,64,96,0.03)}
</style>
</head>
<body>
<div id="app">
  <div class="grid-bg"></div>
  <div class="glow-bg"></div>
  <div id="loading" class="loading">
    <div class="loading-title">◆ SYSTEM ◆</div>
    <div style="font-family:var(--hd);font-size:8px;letter-spacing:3px;color:var(--dim);margin-top:8px">INITIALIZING</div>
    <div class="loading-bar"><div class="loading-fill"></div></div>
  </div>
  <div id="setup" class="setup" style="display:none">
    <div class="setup-box">
      <div style="text-align:center;margin-bottom:28px">
        <div style="font-family:var(--hd);font-size:8px;letter-spacing:4px;color:var(--glow);margin-bottom:14px">▲ SYSTEM INITIALIZATION ▲</div>
        <div style="font-family:var(--hd);font-size:20px;font-weight:700;color:var(--bright);letter-spacing:3px">WELCOME, HUNTER</div>
        <div style="font-family:var(--bd);font-size:14px;color:var(--dim);margin-top:8px;line-height:1.5">The System has detected your presence.<br>Register to begin your ascent.</div>
      </div>
      <div style="margin-bottom:12px">
        <div style="font-family:var(--hd);font-size:7px;letter-spacing:2px;color:var(--dim);margin-bottom:6px">HUNTER NAME</div>
        <input id="setup-name" class="text-inp" placeholder="YOUR NAME..." autocomplete="off">
      </div>
      <button class="btn btn-grn" id="setup-submit" style="margin-top:4px;padding:13px">◆ ENTER THE SYSTEM ◆</button>
      <div style="text-align:center;margin-top:18px;font-family:var(--hd);font-size:7px;letter-spacing:1.5px;color:var(--dim);opacity:.4">"YOU HAVEN'T CLEARED EVEN A SINGLE DUNGEON YET"</div>
    </div>
  </div>
  <!-- main ui -->
  <header class="hdr" id="main-hdr" style="display:none">
    <div class="logo">◆ SYSTEM ◆</div>
    <div class="player-badge">
      <div class="player-info">
        <div class="player-name" id="hdr-name"></div>
        <div class="player-title" id="hdr-title"></div>
      </div>
      <div class="rank-icon" id="hdr-rank"></div>
    </div>
  </header>
  <div class="scroll-area" id="main-scroll" style="display:none">
    <div id="tab-status" class="tab-content"></div>
    <div id="tab-daily" class="tab-content" style="display:none"></div>
    <div id="tab-plan" class="tab-content" style="display:none"></div>
    <div id="tab-training" class="tab-content" style="display:none"></div>
    <div id="tab-archives" class="tab-content" style="display:none"></div>
    <div id="tab-data" class="tab-content" style="display:none"></div>
  </div>
  <nav class="nav" id="main-nav" style="display:none">
    <button class="nav-btn active" data-tab="status"><span class="ni">◈</span>STATUS</button>
    <button class="nav-btn" data-tab="daily"><span class="ni">⊕</span>DAILY</button>
    <button class="nav-btn" data-tab="plan"><span class="ni">◇</span>PLAN</button>
    <button class="nav-btn" data-tab="training"><span class="ni">⊞</span>TRAIN</button>

// ── STORAGE ───────────────────────────────────────────────────────────────────
const DB={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){console.warn('storage full',e)}},
  keys(prefix){return Object.keys(localStorage).filter(k=>k.startsWith(prefix))}
};

// ── UTILS ─────────────────────────────────────────────────────────────────────
const todayStr=()=>new Date().toISOString().split('T')[0];
const uid=()=>Math.random().toString(36).slice(2,10);
const addDays=(d,n)=>{const dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()+n);return dt.toISOString().split('T')[0]};
const fmtDate=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}catch{return d}};
const h=document.getElementById.bind(document);

function getRank(total){
  let r=RANKS[0];
  for(const rr of RANKS){if(total>=rr.min)r=rr;else break;}
  const next=RANKS.find(rr=>rr.min>total)||null;
  const prog=next?Math.min(((total-r.min)/(next.min-r.min))*100,100):100;
  return{...r,next,prog};
}

function isComplete(log){
  if(!log)return false;
  if(!log.dailyQuest?.tasks?.length)return true;
  return log.dailyQuest.tasks.every(t=>Number(log.questProgress?.[t.id]||0)>=t.target);
}

function getStreak(logs){
  let s=0;const d=new Date();
  for(let i=0;i<365;i++){
    const ds=d.toISOString().split('T')[0];
    if(isComplete(logs[ds])){s++;d.setDate(d.getDate()-1);}else break;
  }
  return s;
}

function getFatigue(logs){
  const recent=Object.entries(logs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);
  if(!recent.length)return 0;
  const incomplete=recent.filter(([,l])=>!isComplete(l)).length;
  return Math.min(100,Math.round((incomplete/recent.length)*60));
}

function isPenalty(logs){
  const today=todayStr();
  const yesterday=addDays(today,-1);
  const dates=Object.keys(logs).sort();
  if(!dates.length)return false;
  if(logs[today]?.penaltyAttempt&&!isComplete(logs[today]))return true;
  const before=dates.filter(d=>d<today);
  if(!before.length)return false;
  const last=before[before.length-1];
  return last<yesterday||!isComplete(logs[last]);
}

function questForDate(date,penalty=false,pool=DEFAULT_QUEST_POOL,logs={}){
  if(penalty)return getFatigue(logs)>=45?RECOVERY_QUEST:PENALTY_QUEST;
  if(date===todayStr()&&getFatigue(logs)>=45)return RECOVERY_QUEST;
  const source=pool.length>=3?pool:DEFAULT_QUEST_POOL;
  const seed=[...date].reduce((s,c)=>s+c.charCodeAt(0),0);
  const tasks=source.map((t,i)=>({t,s:Math.sin(seed+i*999)}))
    .sort((a,b)=>a.s-b.s).slice(0,3).map(({t})=>t);
  return{name:'DAILY QUEST: RANDOM GATE',tasks};
}

function getMonthly(logs){
  const month=todayStr().slice(0,7);
  const done=Object.entries(logs).filter(([d,l])=>d.startsWith(month)&&isComplete(l)).length;
  return{done,target:30,unlocked:done>=30};
}

function getSkillState(logs,templates){
  const best={};
  Object.values(logs).forEach(log=>{
    const tpl=templates.find(t=>t.id===log.templateId);
    tpl?.exercises.forEach(ex=>{
      if(ex.unit!=='stage')return;
      log.exLogs?.[ex.id]?.sets?.forEach(set=>{
        const key=(set.v||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
        if(!key)return;
        best[key]=Math.max(best[key]||0,Number(set.seconds||0));
      });
    });
  });
  const unlocked={};
  SKILL_TREES.forEach(tree=>{
    tree.nodes.forEach(node=>{
      const depsMet=(node.deps||[]).every(d=>unlocked[d]);
      unlocked[node.id]=depsMet&&(best[node.id]||0)>=(node.req||0);
    });
  });
  return{best,unlocked};
}

function compressImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error('read error'));
    r.onload=e=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('img error'));
      img.onload=()=>{
        const MAX=520,sc=Math.min(MAX/img.width,MAX/img.height,1);
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.6));
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

function showToast(msg){

function showSys(msg,cb){

    <div class="sys-msg">${msg}</div>

  </div></div>`;
  el.style.display='block';
  const dismiss=()=>{el.style.display='none';cb&&cb();};

  clearTimeout(sysTimer);

}

function card(inner,extra=''){return`<div class="card ${extra}"><div class="card-body">${inner}</div></div>`}
function sec(label){return`<div class="sec">${label}</div>`}
function btn(label,id,cls=''){return`<button class="btn ${cls}" id="${id}">${label}</button>`}

function renderQuestRows(quest,progress,editable=false){
  return quest.tasks.map(task=>{
    const val=Number(progress[task.id]||0);
    const pct=Math.min((val/task.target)*100,100);
    const done=val>=task.target;
    const inp=editable
      ?`<input class="quest-inp" type="number" min="0" step="${task.unit==='km'?'0.1':'1'}" value="${progress[task.id]||''}" placeholder="0" data-tid="${task.id}">`
      :`<div style="font-family:var(--hd);font-size:13px;font-weight:700;color:var(--bright)">${val}/${task.target}</div>`;
    return`<div class="quest-row${done?' done':''}">
      <div class="quest-info">
        <div class="quest-label">${task.label}</div>
        <div class="quest-prog"><div class="quest-fill" style="width:${pct}%"></div></div>
      </div>
      ${inp}
      <div class="quest-target">/${task.target}<br>${task.unit}</div>
    </div>`;
  }).join('');
}

    <div class="stat-card"><div class="stat-val" style="color:#ff8844">${streak}</div><div class="stat-lbl">DAY STREAK</div></div>

  // penalty

      <button class="btn btn-red" id="goto-daily" style="margin-top:12px">ENTER PENALTY QUEST</button>
    </div></div>`;
  }

  // today quest
  html+=card(`
    ${sec(penalty?'MANDATORY CLEAR':'TODAY\'S QUEST')}
    ${todayLog?`
      <div style="font-family:var(--hd);font-size:9px;letter-spacing:1.5px;color:${todayDone?'var(--grn)':'var(--gold)'};margin-bottom:10px">

  // skill tree (compact)

function renderExercises(tpl,exLogs,skillState){
  return tpl.exercises.map(ex=>{
    const sets=exLogs[ex.id]?.sets||[];
    const isKg=ex.unit==='kg';
    const isStage=ex.unit==='stage';
    const gridCols=isKg?'28px 1fr 1fr 28px':isStage?'28px 1.4fr .7fr 28px':'28px 1fr 28px';
    return`<div class="ex-card" data-exid="${ex.id}">
      <div class="ex-hdr">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-unit">${isKg?'WEIGHT × REPS':ex.unit.toUpperCase()}</div>
        </div>
        <button class="btn btn-sm" onclick="addSet('${ex.id}')">+ SET</button>
      </div>
      <div id="sets-${ex.id}">
        ${sets.length===0?`<div style="padding:8px 12px;font-family:var(--hd);font-size:7px;letter-spacing:2px;color:var(--dim)">NO SETS LOGGED</div>`:
        sets.map((set,si)=>`<div class="set-row" style="grid-template-columns:${gridCols}">
          <div class="set-num">${si+1}</div>
          ${isStage?`<select class="sel" style="padding:4px 6px;font-size:12px" onchange="updateSet('${ex.id}',${si},'v',this.value)">
            <option value="">STAGE</option>
            ${getStageOptions(ex,skillState).map(n=>`<option value="${n.label}"${set.v===n.label?' selected':''}${n.locked?' disabled':''}>${n.locked?'🔒 ':' '}${n.label}</option>`).join('')}
          </select>
          <input class="set-inp" type="number" min="0" placeholder="0" value="${set.seconds||''}" onchange="updateSet('${ex.id}',${si},'seconds',this.value)">`
          :isKg?`<input class="set-inp" type="number" min="0" placeholder="0" value="${set.v||''}" onchange="updateSet('${ex.id}',${si},'v',this.value)">
          <input class="set-inp" type="number" min="0" placeholder="0" value="${set.reps||''}" onchange="updateSet('${ex.id}',${si},'reps',this.value)">`
          :`<input class="set-inp" type="number" min="0" step="${ex.unit==='km'?'0.1':'1'}" placeholder="0" value="${set.v||''}" onchange="updateSet('${ex.id}',${si},'v',this.value)">`}
          <button class="remove-btn" onclick="removeSet('${ex.id}',${si})">×</button>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function getStageOptions(ex,skillState){
  const name=ex.name.toLowerCase();
  let tree=SKILL_TREES.find(t=>t.id==='planche');
  if(name.includes('lever'))tree=SKILL_TREES.find(t=>t.id==='front_lever');
  else if(name.includes('handstand')||name.includes('hspu'))tree=SKILL_TREES.find(t=>t.id==='handstand');
  else if(name.includes('muscle'))tree=SKILL_TREES.find(t=>t.id==='muscle_up');
  else if(name.includes('pistol'))tree=SKILL_TREES.find(t=>t.id==='pistol');
  else if(name.includes('l-sit')||name.includes('v-sit'))tree=SKILL_TREES.find(t=>t.id==='lsit');
  return tree.nodes.map(n=>({...n,locked:!(n.deps||[]).every(d=>skillState.unlocked[d])}));
}

function addSet(exId){
  const sets=dailyState.exLogs[exId]?.sets||[];
  const last=sets[sets.length-1]||{};
  dailyState.exLogs[exId]={sets:[...sets,{v:last.v||'',reps:last.reps||'',seconds:last.seconds||''}]};
  const{templates,logs}=STATE;
  const tpl=templates.find(t=>t.id===dailyState.templateId);
  if(tpl){const ss=h(`sets-${exId}`);if(ss)ss.outerHTML=`<div id="sets-${exId}">`+renderExerciseSets(tpl.exercises.find(e=>e.id===exId),dailyState.exLogs[exId]?.sets||[],getSkillState(logs,templates))+'</div>';}
  renderDaily();
}

function removeSet(exId,si){
  const sets=[...(dailyState.exLogs[exId]?.sets||[])];
  sets.splice(si,1);
  dailyState.exLogs[exId]={sets};
  renderDaily();
}

function updateSet(exId,si,field,val){
  const sets=[...(dailyState.exLogs[exId]?.sets||[{}])];
  sets[si]={...sets[si],[field]:val};
  dailyState.exLogs[exId]={sets};
}

function bindDailyEvents(){
  h('daily-date')?.addEventListener('change',e=>{
    dailyState.date=e.target.value;
    loadDailyFromLogs(e.target.value);
    renderDaily();
  });

  document.querySelectorAll('[data-tid]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      dailyState.questProgress[e.target.dataset.tid]=e.target.value;
      const task=questForDate(dailyState.date,isPenalty(STATE.logs),STATE.questPool,STATE.logs).tasks.find(t=>t.id===e.target.dataset.tid);
      if(task){const pct=Math.min((Number(e.target.value||0)/task.target)*100,100);const row=e.target.closest('.quest-row');if(row){row.classList.toggle('done',Number(e.target.value||0)>=task.target);row.querySelector('.quest-fill').style.width=pct+'%';}}
    });
  });

  h('water-dec')?.addEventListener('click',()=>{
    dailyState.recovery.water=Math.max(0,(dailyState.recovery.water||0)-1);
    h('water-val').textContent=dailyState.recovery.water;
  });
  h('water-inc')?.addEventListener('click',()=>{
    dailyState.recovery.water=Math.min(20,(dailyState.recovery.water||0)+1);
    h('water-val').textContent=dailyState.recovery.water;
  });
  h('creatine-check')?.addEventListener('change',e=>{dailyState.recovery.creatine=e.target.checked;});

  ['photo-slot-0','photo-slot-1','photo-slot-2'].forEach((sid,i)=>{
    h(sid)?.addEventListener('click',()=>h(`photo-inp-${i}`)?.click());
    h(`photo-inp-${i}`)?.addEventListener('change',async e=>{
      const file=e.target.files?.[0];
      if(!file)return;
      try{
        const compressed=await compressImage(file);
        dailyState.photos[i]=compressed;
        renderDaily();
      }catch{showToast('IMAGE UPLOAD FAILED');}
    });
  });

  h('tpl-select')?.addEventListener('change',e=>{
    dailyState.templateId=e.target.value;
    renderDaily();
  });

  h('save-daily-btn')?.addEventListener('click',()=>saveLog(true));
  h('save-training-btn')?.addEventListener('click',()=>saveLog(false));
}

async function saveLog(dailyOnly=false){
  const{date,photos,templateId,exLogs,questProgress,recovery}=dailyState;
  const today=todayStr();
  const penalty=date===today&&isPenalty(STATE.logs);
  const quest=questForDate(date,penalty,STATE.questPool,STATE.logs);
  const questDone=quest.tasks.every(t=>Number(questProgress[t.id]||0)>=t.target);

  const existing=STATE.logs[date]||{};
  const logData={
    ...existing,
    questProgress,
    recovery,
    dailyQuest:quest,
    penaltyAttempt:penalty,
    penaltyCleared:penalty&&questDone,
    savedAt:new Date().toISOString(),
    ...(dailyOnly?{}:{photos,templateId,exLogs,trainingSavedAt:new Date().toISOString()}),
  };

  const newLogs={...STATE.logs,[date]:logData};
  STATE.logs=newLogs;
  const total=Object.keys(newLogs).length;
  STATE.player={...STATE.player,totalWorkouts:total};

  DB.set(`sl_log:${date}`,logData);
  DB.set('sl_player',STATE.player);
  updateHeader();

  if(penalty&&questDone)showSys('PENALTY QUEST CLEARED\nSYSTEM RESTORED');
  else if(questDone)showSys('QUEST COMPLETED\n+500 EXP GAINED');
  else showToast('LOG SAVED');
}

function renderPlan(){
  const{logs,questPool}=STATE;
  const today=todayStr();
  const d=new Date(today+'T12:00:00');
  const startOffset=d.getDay()===0?-6:1-d.getDay();
  const dates=Array.from({length:7},(_,i)=>addDays(today,startOffset+i));
  const fatigue=getFatigue(logs);

  let html='';
  html+=card(`
    ${sec('WEEK OVERVIEW')}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-family:var(--bd);font-size:14px;color:var(--text)">
        ${fatigue>=45?'Deload active — recovery quests':'Load is stable — maintain consistency'}

    </div>
    <div class="week-grid">
      ${dates.map(dt=>{
        const log=logs[dt];

          <div class="week-date">${dt.slice(8)}</div>
          <div class="week-status">${done?'✓':missed?'✗':'·'}</div>
        </div>`;
      }).join('')}
    </div>
  `);

  // upcoming quests
  html+=card(`
    ${sec('UPCOMING QUESTS')}
    ${dates.filter(dt=>dt>=today).map(dt=>{
      const quest=questForDate(dt,false,questPool,logs);

  h('tab-plan').innerHTML=html;

function toggleTpl(id){
  const body=h(`tplbody-${id}`);
  if(body)body.style.display=body.style.display==='none'?'block':'none';
}

function editTpl(id){
  const tpl=STATE.templates.find(t=>t.id===id);
  if(!tpl)return;
  const name=prompt('Template name:',tpl.name);
  if(name===null)return;
  const updated={...tpl,name:name.trim().toUpperCase()||tpl.name};
  STATE.templates=STATE.templates.map(t=>t.id===id?updated:t);
  DB.set('sl_templates',STATE.templates);
  showToast('SAVED');
  renderTraining();
}

function deleteTpl(id){
  if(!confirm('Delete this training type?'))return;
  STATE.templates=STATE.templates.filter(t=>t.id!==id);
  DB.set('sl_templates',STATE.templates);
  renderTraining();
}

function addNewTemplate(){
  const name=prompt('New template name:');
  if(!name)return;
  const n={id:uid(),name:name.trim().toUpperCase(),color:'#00c8ff',exercises:[]};
  STATE.templates=[...STATE.templates,n];
  DB.set('sl_templates',STATE.templates);
  showToast('TEMPLATE CREATED');
  renderTraining();
}

function editQuestPool(){
  const pool=STATE.questPool;
  const labels=pool.map(q=>`${q.label}:${q.target}${q.unit}`).join('\n');
  const result=prompt(`Edit quest pool (format: Name:TargetUnit)\n\n${labels}\n\nNote: Edit in the app for best results.`);
  if(result===null)return;
  showToast('Use the full editor for quest pool changes.');
}

  let html=`<button class="btn btn-sm" id="arch-back" style="margin-bottom:12px;width:auto">← BACK</button>`;

        </div>`;
      }).join('')}

  }

  html+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
    <div style="background:rgba(0,200,255,.04);border:1px solid rgba(0,200,255,.1);border-radius:4px;padding:5px 10px;font-family:var(--hd);font-size:7.5px;color:var(--text)">💧 WATER ${recovery.water||0}/8</div>
    <div style="background:rgba(0,200,255,.04);border:1px solid rgba(0,200,255,.1);border-radius:4px;padding:5px 10px;font-family:var(--hd);font-size:7.5px;color:${recovery.creatine?'var(--grn)':'var(--dim)'}">CREATINE ${recovery.creatine?'✓':'—'}</div>
  </div>`;

  if(log.photos?.some(Boolean)){
    html+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px">
      ${['FRONT','SIDE','BACK'].map((lbl,i)=>log.photos[i]?`
        <div><div style="aspect-ratio:3/4;overflow:hidden;border:1px solid rgba(0,200,255,.15);border-radius:4px"><img src="${log.photos[i]}" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="text-align:center;font-family:var(--hd);font-size:7px;letter-spacing:1px;color:var(--dim);margin-top:3px">${lbl}</div></div>`:
        `<div></div>`).join('')}
    </div>`;
  }

  if(tpl){
    html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <div style="width:8px;height:8px;border-radius:50%;background:${tpl.color}"></div>
      <span style="font-family:var(--hd);font-size:10px;letter-spacing:1.5px;color:var(--bright)">${tpl.name}</span>
    </div>`;
    tpl.exercises.forEach(ex=>{
      const exlog=log.exLogs?.[ex.id];
      if(!exlog?.sets?.length)return;
      html+=`<div style="margin-bottom:10px">
        <div style="font-family:var(--hd);font-size:7.5px;letter-spacing:1px;color:var(--dim);margin-bottom:6px">${ex.name}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          ${exlog.sets.map(set=>{
            let val=ex.unit==='kg'?`${set.v||0}kg × ${set.reps||0}`:ex.unit==='stage'?`${set.v||'—'}${set.seconds?` · ${set.seconds}s`:''}`:` ${set.v||0} ${ex.unit}`;
            return`<div class="set-chip">${val}</div>`;
          }).join('')}
        </div>
      </div>`;
    });
  }

  html+=`</div></div>`;
  h('tab-archives').innerHTML=html;
  h('arch-back')?.addEventListener('click',()=>{archiveSelDate=null;renderArchives();});
}

// ── DATA TAB ──────────────────────────────────────────────────────────────────
function renderData(){
  const{player,templates,questPool,logs}=STATE;
  h('tab-data').innerHTML=`
    <div class="card"><div class="card-body">
      ${sec('DATA VAULT')}
      <div style="font-family:var(--bd);font-size:14px;color:var(--dim);line-height:1.5;margin-bottom:14px">
        Export your full data as a JSON backup. Import to restore on any device.
      </div>
      <button class="btn btn-grn" id="export-btn" style="margin-bottom:8px">EXPORT BACKUP</button>
      <button class="btn" id="import-btn">IMPORT BACKUP</button>
      <input type="file" id="import-inp" accept="application/json" style="display:none">
    </div></div>
    <div class="card"><div class="card-body">
      ${sec('STATS')}
      <div style="display:grid;gap:8px">
        <div style="display:flex;justify-content:space-between"><span style="font-family:var(--hd);font-size:8px;color:var(--dim)">SESSIONS</span><span style="font-family:var(--hd);font-size:8px;color:var(--bright)">${Object.keys(logs).length}</span></div>
        <div style="display:flex;justify-content:space-between"><span style="font-family:var(--hd);font-size:8px;color:var(--dim)">TEMPLATES</span><span style="font-family:var(--hd);font-size:8px;color:var(--bright)">${templates.length}</span></div>
        <div style="display:flex;justify-content:space-between"><span style="font-family:var(--hd);font-size:8px;color:var(--dim)">QUEST POOL</span><span style="font-family:var(--hd);font-size:8px;color:var(--bright)">${questPool.length}</span></div>
        <div style="display:flex;justify-content:space-between"><span style="font-family:var(--hd);font-size:8px;color:var(--dim)">HUNTER</span><span style="font-family:var(--hd);font-size:8px;color:var(--bright)">${player.name}</span></div>
      </div>
    </div></div>
    <div class="card"><div class="card-body">
      ${sec('INSTALL AS APP')}
      <div style="font-family:var(--bd);font-size:14px;color:var(--dim);line-height:1.6">
        <strong style="color:var(--bright)">Android:</strong> Open in Chrome → Menu (⋮) → "Add to Home screen"<br><br>
        <strong style="color:var(--bright)">iPhone:</strong> Open in Safari → Share → "Add to Home Screen"<br><br>
        <span style="color:var(--dim);font-size:12px">The app works offline once installed.</span>
      </div>
    </div></div>
  `;

  h('export-btn')?.addEventListener('click',()=>{
    const backup={version:1,exportedAt:new Date().toISOString(),player,templates,questPool,logs};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`system-backup-${todayStr()}.json`;a.click();
    URL.revokeObjectURL(url);
  });

  h('import-btn')?.addEventListener('click',()=>h('import-inp')?.click());
  h('import-inp')?.addEventListener('change',async e=>{
    const file=e.target.files?.[0];
    if(!file)return;
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      if(data.player)STATE.player=data.player;
      if(data.templates)STATE.templates=data.templates;
      if(data.questPool)STATE.questPool=data.questPool;
      if(data.logs)STATE.logs=data.logs;
      DB.set('sl_player',STATE.player);
      DB.set('sl_templates',STATE.templates);
      DB.set('sl_quest_pool',STATE.questPool);
      Object.entries(STATE.logs).forEach(([d,l])=>DB.set(`sl_log:${d}`,l));
      updateHeader();
      renderCurrentTab();
      showSys('BACKUP IMPORTED\nSYSTEM RESTORED');
    }catch{showToast('IMPORT FAILED');}
  });
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function switchTab(id){
  STATE.activeTab=id;
  document.querySelectorAll('.tab-content').forEach(el=>el.style.display='none');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
  h(`tab-${id}`).style.display='block';
  h('main-scroll').scrollTop=0;
  renderCurrentTab();
}

function renderCurrentTab(){
  const id=STATE.activeTab;
  if(id==='status')renderStatus();
  else if(id==='daily')renderDaily();
  else if(id==='plan')renderPlan();
  else if(id==='training')renderTraining();
  else if(id==='archives')renderArchives();
  else if(id==='data')renderData();
}

// ── HEADER ────────────────────────────────────────────────────────────────────
function updateHeader(){
  if(!STATE.player)return;
  const ri=getRank(STATE.player.totalWorkouts||0);
  h('hdr-name').textContent=STATE.player.name;
  h('hdr-title').textContent=`LVL ${ri.level} · ${ri.title}`;
  h('hdr-title').style.color=ri.color;
  h('hdr-rank').textContent=ri.rank;
  h('hdr-rank').style.color=ri.color;
  h('hdr-rank').style.borderColor=ri.color;
  const isPenaltyMode=isPenalty(STATE.logs);
  document.getElementById('app').classList.toggle('penalty-mode',isPenaltyMode);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function initApp(){
  const{player}=STATE;
  h('loading').style.display='none';

  if(!player){
    h('setup').style.display='flex';
    h('setup-submit').addEventListener('click',()=>{
      const name=h('setup-name').value.trim();
      if(!name)return;
      STATE.player={name:name.toUpperCase(),totalWorkouts:0,createdAt:new Date().toISOString()};
      DB.set('sl_player',STATE.player);
      h('setup').style.display='none';
      showMain();
      showSys(`WELCOME TO THE SYSTEM\n${STATE.player.name}`);
    });
    h('setup-name').addEventListener('keydown',e=>{if(e.key==='Enter')h('setup-submit').click();});
    return;
  }
  showMain();
}

function showMain(){
  h('main-hdr').style.display='flex';
  h('main-scroll').style.display='block';
  h('main-nav').style.display='flex';
  h('tab-status').style.display='block';
  updateHeader();
  loadDailyFromLogs(todayStr());
  renderCurrentTab();

  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click',()=>switchTab(btn.dataset.tab));
  });
}

// load data
(function(){
  const savedPlayer=DB.get('sl_player');
  const savedTemplates=DB.get('sl_templates');
  const savedPool=DB.get('sl_quest_pool');

  if(savedPlayer)STATE.player=savedPlayer;
  if(savedTemplates){
    // merge with defaults
    const saved=savedTemplates;
    const seen=new Set(saved.map(t=>t.id));
    STATE.templates=[...saved,...DEFAULT_TEMPLATES.filter(t=>!seen.has(t.id))];
  }
  if(savedPool){
    const seen=new Set(savedPool.map(q=>q.id));
    STATE.questPool=[...savedPool,...DEFAULT_QUEST_POOL.filter(q=>!seen.has(q.id))];
  }

  // load logs
  DB.keys('sl_log:').forEach(k=>{
    const log=DB.get(k);
    if(log)STATE.logs[k.replace('sl_log:','')]=log;
  });

  setTimeout(initApp,800);
})();

// service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
